<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MUZIK Ball</title>
<style>
:root { --text:#fff8e8; --accent:#ffe066; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#07060a; color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
canvas { display:block; width:100%; height:100%; touch-action:none; }
.ui { position:fixed; inset:0; pointer-events:none; }
.ui a, .ui button { pointer-events:auto; font:inherit; cursor:pointer; }
.top { position:absolute; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; gap:8px; }
a.back { text-decoration:none; background:#1a1612; border:1px solid #4a4036; border-radius:10px; padding:10px 12px; font-weight:800; font-size:12px; color:#ffe066; }
.hud { position:absolute; left:0; right:0; bottom:max(16px, env(safe-area-inset-bottom)); text-align:center; pointer-events:none; }
.hud b { display:block; font-size:28px; color:#ffe066; letter-spacing:.04em; }
.hud span { display:block; margin-top:2px; font-size:13px; font-weight:800; color:#f4ecdf; }
.hud small { display:block; margin-top:6px; font-size:11px; color:#a89880; font-weight:700; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="ui">
  <div class="top"><a class="back" href="/studio.html">Studio</a></div>
  <div class="hud" id="hud"><b>—</b><span>— Hz</span><small>drag the ball · pinch to zoom</small></div>
</div>
<script>
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteName(m){ return NAMES[((m%12)+12)%12]+Math.floor(m/12); }
function hz(m){ return 440*Math.pow(2,(m-69)/12); }
function fmtHz(f){
  if(f>=100) return f.toFixed(1)+" Hz";
  if(f>=10) return f.toFixed(2)+" Hz";
  return f.toFixed(3)+" Hz";
}
function hsl(m){
  const pc=((m%12)+12)%12, oct=Math.floor(m/12);
  return [pc*30, 85, 42+Math.max(0,Math.min(8,oct+1))*4];
}
const points=[];
for(let o=-8;o<=8;o++){
  for(let pc=0;pc<12;pc++){
    const midi=(o+1)*12+pc;
    const v=(o+8)/16;
    const phi=v*Math.PI;
    const theta=(pc/12)*Math.PI*2;
    const y=Math.cos(phi);
    const r=Math.sin(phi);
    points.push({midi,x:Math.cos(theta)*r,y,z:Math.sin(theta)*r,pc});
  }
}
let focus=12;
try{
  const p=JSON.parse(localStorage.getItem("studio-project")||"null");
  if(p&&Number.isFinite(p.lastHit)) focus=p.lastHit;
}catch(e){}
function byMidi(m){ return points.find(p=>p.midi===m)||points[0]; }
function orientOf(p){
  const yaw=Math.atan2(-p.x, p.z);
  const z1=-p.x*Math.sin(yaw)+p.z*Math.cos(yaw);
  const pitch=Math.atan2(p.y, z1);
  return {yaw,pitch};
}
let yaw=0, pitch=0, dist=3.4, bob=0;
let target=orientOf(byMidi(focus));
yaw=target.yaw; pitch=target.pitch;
let settling=false, dragging=false;
const cv=document.getElementById("view");
const ctx=cv.getContext("2d");
let W=1,H=1,DPR=1;
function resize(){
  DPR=Math.min(2, devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();
function wrap(d){ while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return d; }
function rot(p){
  const x1=p.x*Math.cos(yaw)+p.z*Math.sin(yaw);
  const z1=-p.x*Math.sin(yaw)+p.z*Math.cos(yaw);
  const y2=p.y*Math.cos(pitch)-z1*Math.sin(pitch);
  const z2=p.y*Math.sin(pitch)+z1*Math.cos(pitch);
  return {x:x1,y:y2,z:z2};
}
function project(p){
  const s=rot(p);
  const f=(Math.min(W,H)*0.38)/(dist-s.z);
  return {sx:W/2+s.x*f, sy:H/2-s.y*f+bob, z:s.z, f, midi:p.midi};
}
function nearest(x,y,limit){
  let best=null, bestD=limit*limit;
  for(const p of points){
    const q=project(p);
    if(q.z<0.05) continue;
    const d=(q.sx-x)*(q.sx-x)+(q.sy-y)*(q.sy-y);
    if(d<bestD){ bestD=d; best=p; }
  }
  return best;
}
function facing(){ return nearest(W/2, H/2+bob, 1e9); }
let ac, osc, gainN;
function audio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  osc=ac.createOscillator();
  osc.type="triangle";
  gainN=ac.createGain(); gainN.gain.value=0.0001;
  osc.connect(gainN); gainN.connect(ac.destination);
  osc.frequency.value=Math.max(1,hz(focus));
  osc.start();
}
function sound(m){
  audio();
  if(ac.state==="suspended") ac.resume();
  const now=ac.currentTime;
  const f=Math.max(1,hz(m));
  osc.frequency.cancelScheduledValues(now);
  osc.frequency.setValueAtTime(Math.max(1, osc.frequency.value||f), now);
  osc.frequency.exponentialRampToValueAtTime(f, now+0.07);
  gainN.gain.cancelScheduledValues(now);
  gainN.gain.setTargetAtTime(0.22, now, 0.03);
}
function hush(){
  if(!gainN||!ac) return;
  gainN.gain.cancelScheduledValues(ac.currentTime);
  gainN.gain.setTargetAtTime(0.0001, ac.currentTime, 0.12);
}
function saveFocus(){
  try{
    const raw=localStorage.getItem("studio-project");
    const p=raw?JSON.parse(raw):{v:1,tracks:[]};
    p.lastHit=focus; p.keyRoot=focus;
    localStorage.setItem("studio-project", JSON.stringify(p));
  }catch(e){}
}
function setFocus(m, play){
  focus=m;
  target=orientOf(byMidi(m));
  settling=true;
  saveFocus();
  if(play) sound(m);
  const hud=document.getElementById("hud");
  hud.querySelector("b").textContent=noteName(m);
  hud.querySelector("span").textContent=fmtHz(hz(m));
}
setFocus(focus, false);
function frame(t){
  bob=Math.sin(t/900)*10;
  if(settling && !dragging){
    yaw+=wrap(target.yaw-yaw)*0.12;
    pitch+=wrap(target.pitch-pitch)*0.12;
    if(Math.abs(wrap(target.yaw-yaw))<0.002 && Math.abs(wrap(target.pitch-pitch))<0.002){
      yaw=target.yaw; pitch=target.pitch; settling=false;
    }
  }
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*0.7);
  sky.addColorStop(0,"#1a1428"); sky.addColorStop(1,"#07060a");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  const sil=(Math.min(W,H)*0.38)/dist;
  const gx=W/2, gy=H/2+bob;
  ctx.beginPath(); ctx.arc(gx, gy+sil*0.08, sil*0.92, 0, Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fill();
  const body=ctx.createRadialGradient(gx-sil*0.35, gy-sil*0.4, sil*0.1, gx, gy, sil);
  body.addColorStop(0,"#3a3450"); body.addColorStop(0.55,"#16131c"); body.addColorStop(1,"#0a090c");
  ctx.beginPath(); ctx.arc(gx, gy, sil, 0, Math.PI*2); ctx.fillStyle=body; ctx.fill();
  const drawn=points.map(p=>({p,q:project(p)})).sort((a,b)=>a.q.z-b.q.z);
  for(const {p,q} of drawn){
    if(q.z<-0.15) continue;
    const front=Math.max(0, Math.min(1, (q.z+0.15)/1.15));
    const [hh,s,l]=hsl(p.midi);
    const rad=Math.max(2, q.f*0.055)*(0.45+front*0.9);
    ctx.globalAlpha=0.25+front*0.75;
    ctx.beginPath(); ctx.arc(q.sx, q.sy, rad, 0, Math.PI*2);
    ctx.fillStyle=`hsl(${hh} ${s}% ${l}%)`;
    ctx.fill();
    if(p.midi===focus){
      ctx.globalAlpha=1;
      ctx.lineWidth=2;
      ctx.strokeStyle="#fff";
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(255,224,102,.9)";
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(W/2, H/2+bob, 14, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W/2-22, H/2+bob); ctx.lineTo(W/2-6, H/2+bob);
  ctx.moveTo(W/2+6, H/2+bob); ctx.lineTo(W/2+22, H/2+bob);
  ctx.moveTo(W/2, H/2+bob-22); ctx.lineTo(W/2, H/2+bob-6);
  ctx.moveTo(W/2, H/2+bob+6); ctx.lineTo(W/2, H/2+bob+22);
  ctx.stroke();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let ptr=null, pinch=null, moved=0;
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId);
  if(!ptr){ ptr={id:e.pointerId,x:e.clientX,y:e.clientY}; moved=0; dragging=true; settling=false; audio(); }
  else if(!pinch){ pinch={id:e.pointerId,x:e.clientX,y:e.clientY,dist}; }
});
cv.addEventListener("pointermove", e=>{
  if(pinch && (e.pointerId===pinch.id || (ptr&&e.pointerId===ptr.id))){
    const a=e.pointerId===ptr.id?e:null;
    return;
  }
  if(!ptr || e.pointerId!==ptr.id) return;
  const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;
  moved+=Math.abs(dx)+Math.abs(dy);
  ptr.x=e.clientX; ptr.y=e.clientY;
  yaw+=dx*0.008;
  pitch=Math.max(-1.2, Math.min(1.2, pitch+dy*0.008));
  const face=facing();
  if(face && face.midi!==focus){
    focus=face.midi;
    const hud=document.getElementById("hud");
    hud.querySelector("b").textContent=noteName(focus);
    hud.querySelector("span").textContent=fmtHz(hz(focus));
    sound(focus);
  }
});
function endPtr(e){
  if(pinch && e.pointerId===pinch.id){ pinch=null; return; }
  if(!ptr || e.pointerId!==ptr.id) return;
  dragging=false;
  ptr=null;
  if(moved<10){
    const hit=nearest(e.clientX, e.clientY, 36);
    if(hit){ setFocus(hit.midi, true); return; }
  }
  const face=facing();
  if(face) setFocus(face.midi, true);
  else hush();
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  dist=Math.max(1.8, Math.min(6.5, dist+e.deltaY*0.002));
},{passive:false});
const touches=new Map();
cv.addEventListener("touchstart", e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
},{passive:true});
cv.addEventListener("touchmove", e=>{
  if(touches.size<2) {
    for(const t of e.changedTouches) if(touches.has(t.identifier)) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
    return;
  }
  e.preventDefault();
  const ids=[...touches.keys()];
  const a=e.touches[0], b=e.touches[1];
  if(!a||!b) return;
  const prevA=touches.get(a.identifier), prevB=touches.get(b.identifier);
  if(prevA&&prevB){
    const d0=Math.hypot(prevA.x-prevB.x, prevA.y-prevB.y);
    const d1=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if(d0>0) dist=Math.max(1.8, Math.min(6.5, dist*(d0/d1)));
  }
  touches.set(a.identifier,{x:a.clientX,y:a.clientY});
  touches.set(b.identifier,{x:b.clientX,y:b.clientY});
},{passive:false});
cv.addEventListener("touchend", e=>{ for(const t of e.changedTouches) touches.delete(t.identifier); },{passive:true});
</script>
</body>
</html>
