<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>MUZIK Room</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.dock{position:fixed;display:flex;gap:10px;z-index:2;pointer-events:none}
.dock button{pointer-events:auto;width:64px;height:64px;border-radius:20px;border:4px solid rgba(255,255,255,.18);background:rgba(20,24,40,.72);font-size:32px;line-height:1;padding:0;color:#fff;touch-action:manipulation;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.5);transition:transform .12s,border-color .12s,background .12s}
.dock button.on{border-color:#ffe066;background:rgba(80,64,20,.85);transform:scale(1.06)}
.dock button:active{transform:scale(.92)}
#home{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
#home button{font-size:40px;color:#ffe066}
#modes{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
#tools{bottom:calc(14px + env(safe-area-inset-bottom));right:calc(12px + env(safe-area-inset-right))}
#tools button[hidden]{display:none}
@media (max-width:420px){.dock button{width:56px;height:56px;font-size:28px;border-radius:18px}.dock{gap:8px}}
@media (prefers-reduced-motion:reduce){.dock button{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="dock" id="home"><button type="button" id="homeBtn" aria-label="Studio">⌂</button></div>
<div class="dock" id="modes">
  <button type="button" data-mode="tank" aria-label="Tank" class="on">🌊</button>
  <button type="button" data-mode="bounce" aria-label="Bounce">💥</button>
  <button type="button" data-mode="paint" aria-label="Paint">🎨</button>
</div>
<div class="dock" id="tools">
  <button type="button" id="beatBtn" aria-label="Beat">🥁</button>
  <button type="button" id="quantBtn" aria-label="Snap to beat" hidden>🎯</button>
  <button type="button" id="sizeBtn" aria-label="Ball size" hidden>⚪</button>
  <button type="button" id="clearBtn" aria-label="Clear" hidden>🧹</button>
</div>
<script src="audio.js"></script>
<script>
"use strict";
const A=window.MuzikAudio;
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
const RM=matchMedia("(prefers-reduced-motion: reduce)");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();
["gesturestart","gesturechange","dblclick","contextmenu"].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

/* ---------- key / scale / color ---------- */
const SCALE=[0,2,4,7,9]; // major pentatonic
let root=A.keyRoot();
const pcOf=m=>((m%12)+12)%12;
function hue(m){return pcOf(m)*30;}
function col(m,l,a){return `hsla(${hue(m)},85%,${l==null?55:l}%,${a==null?1:a})`;}
function degNote(i,oct){const n=SCALE.length,o=Math.floor(i/n),d=((i%n)+n)%n;return 12*(oct+1)+root+SCALE[d]+12*o;}
function snap(m){let best=m,bd=99;for(let k=-12;k<=12;k++){const c=m+k;if(SCALE.includes(pcOf(c-root))&&Math.abs(k)<bd){bd=Math.abs(k);best=c;}}return best;}
let BPM=A.bpm();
const beatSec=()=>60/BPM;

/* ---------- shared fx ---------- */
const sparks=[],flashes=[];
function spark(x,y,m,n){if(RM.matches)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*6.283,s=60+Math.random()*240;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,m});}if(sparks.length>400)sparks.splice(0,sparks.length-400);}
function flash(x,y,m,r){flashes.push({x,y,m,r:r||60,l:1});}
function drawFx(dt){
  cx.globalCompositeOperation="lighter";
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+200*dt;p.l-=dt*1.6;if(p.l<=0){sparks.splice(i,1);continue;}
    cx.fillStyle=col(p.m,65,p.l);cx.beginPath();cx.arc(p.x,p.y,3+4*p.l,0,6.283);cx.fill();}
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.l-=dt*2.5;if(f.l<=0){flashes.splice(i,1);continue;}
    const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*(1.6-f.l*.6));g.addColorStop(0,col(f.m,80,.9*f.l));g.addColorStop(1,col(f.m,50,0));cx.fillStyle=g;cx.beginPath();cx.arc(f.x,f.y,f.r*(1.6-f.l*.6),0,6.283);cx.fill();}
  cx.globalCompositeOperation="source-over";
}
let keyFlash=0;

/* ---------- beat clock ---------- */
let beatOn=false,pulse=0,nextBeat=0,beatN=0;
function beatTick(){ // schedule soft kick/hat ahead + visual pulse
  const ac=A.ctx;if(!ac)return;
  if(nextBeat<ac.currentTime)nextBeat=ac.currentTime+0.05;
  while(nextBeat<ac.currentTime+0.12){
    const t=nextBeat,n=beatN;
    if(beatOn&&mode==="tank"){if(n%2===0)A.drum("kick",t,0.55);A.drum("hat",t+beatSec()/2,0.35);}
    setTimeout(()=>{pulse=n%4===0?1:.7;},Math.max(0,(t-ac.currentTime)*1000));
    nextBeat+=beatSec();beatN++;
  }
}

/* ---------- mode switching ---------- */
let mode="tank";
const tools={beatBtn:["tank"],quantBtn:["bounce"],sizeBtn:["bounce"],clearBtn:["bounce","paint"]};
function setMode(m){mode=m;document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  for(const id in tools)document.getElementById(id).hidden=!tools[id].includes(m);
  ptrs.forEach(p=>endPtr(p,true));ptrs.clear();}
document.querySelectorAll("#modes button").forEach(b=>b.addEventListener("click",()=>{A.init();setMode(b.dataset.mode);}));
document.getElementById("homeBtn").addEventListener("click",()=>{location.href="studio.html";});
const beatBtn=document.getElementById("beatBtn");
beatBtn.addEventListener("click",()=>{A.init();beatOn=!beatOn;beatBtn.classList.toggle("on",beatOn);});
let quant=false;const quantBtn=document.getElementById("quantBtn");
quantBtn.addEventListener("click",()=>{A.init();quant=!quant;quantBtn.classList.toggle("on",quant);});
let bigBall=false;const sizeBtn=document.getElementById("sizeBtn");
sizeBtn.addEventListener("click",()=>{bigBall=!bigBall;sizeBtn.textContent=bigBall?"🔴":"⚪";sizeBtn.classList.toggle("on",bigBall);});
document.getElementById("clearBtn").addEventListener("click",()=>{if(mode==="bounce"){bars.length=0;balls.length=0;}else{strokes.length=0;}spark(W/2,H/2,root+60,30);});

/* ---------- tilt ---------- */
// Natural tilt: inverted vs. old mapping, ~half sensitivity, dead zone, smoothing, clamp.
let tiltX=0,tiltY=0,tiltAsked=false,rawTX=0,rawTY=0;const TILT_DZ=0.05,TILT_MAX=0.5;
function tiltShape(v){const a=Math.abs(v);if(a<TILT_DZ)return 0;return Math.sign(v)*Math.min(TILT_MAX,(a-TILT_DZ)/(1-TILT_DZ));}
function tiltSmooth(dt){const k=1-Math.exp(-dt*6);tiltX+=(rawTX-tiltX)*k;tiltY+=(rawTY-tiltY)*k;}
function askTilt(){if(tiltAsked)return;tiltAsked=true;const D=window.DeviceOrientationEvent;
  const on=()=>addEventListener("deviceorientation",e=>{if(e.gamma==null)return;rawTX=tiltShape(-e.gamma/90);rawTY=tiltShape(-((e.beta==null?45:e.beta)-45)/90);});
  if(D&&typeof D.requestPermission==="function"){D.requestPermission().then(s=>{if(s==="granted")on();}).catch(()=>{});}else if(D)on();}

/* ---------- draw tone (sound while drawing) ---------- */
function drawToneNote(y){const t=1-Math.max(0,Math.min(1,y/H));return degNote(Math.round(t*14),3);}
function toneStart(p){if(!A.ctx)return;p.tm=drawToneNote(p.y);p.tv=A.start(p.tm,0.12);p.tt=0;}
function toneMove(p){if(!p.tv)return;const now=performance.now();if(now-p.tt<40)return;const m=drawToneNote(p.y);if(m!==p.tm){p.tm=m;p.tt=now;A.glide(p.tv,m,0.07);}}
function toneStop(p){if(p.tv){A.release(p.tv,0.18);p.tv=null;}}
/* ---------- pointers ---------- */
const ptrs=new Map();
cv.addEventListener("pointerdown",e=>{e.preventDefault();A.init();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:performance.now(),path:[{x:e.clientX,y:e.clientY,t:performance.now()}],moved:0,long:false};
  ptrs.set(e.pointerId,p);
  if(mode==="tank")tankDown(p);else if(mode==="bounce"){askTilt();bounceDown(p);if(!p.grab)toneStart(p);}else{paintDown(p);toneStart(p);}});
cv.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
  for(const ev of evs){const dx=ev.clientX-p.x,dy=ev.clientY-p.y;p.moved+=Math.hypot(dx,dy);p.x=ev.clientX;p.y=ev.clientY;p.path.push({x:p.x,y:p.y,t:performance.now()});}
  if(p.path.length>600)p.path.splice(1,p.path.length-600);
  if(mode==="tank")tankMove(p);else if(mode==="bounce")bounceMove(p);else paintMove(p);if(p.cancel)toneStop(p);else toneMove(p);});
function up(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);endPtr(p,false);}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
function endPtr(p,abort){toneStop(p);if(mode==="tank")tankUp(p);else if(mode==="bounce")bounceUp(p,abort);else paintUp(p,abort);}
function checkLong(now){ // long-press still = set key root from X (12 chromatic columns)
  for(const p of ptrs.values()){if(p.long||p.moved>14||now-p.t0<1100)continue;p.long=true;
    const pc=Math.min(11,Math.floor(p.x/W*12));const m=60+pc;root=pc;A.setKey(m);keyFlash=1;
    A.note(m,0.6,0.3);A.note(m+7,0.6,0.18);flash(p.x,p.y,m,Math.max(W,H)*.35);spark(p.x,p.y,m,40);
    if(mode==="bounce"){p.cancel=true;} if(mode==="paint"){p.cancel=true;}toneStop(p);}}

/* ================= 1. TANK ================= */
const rings=[],wakes=[];let lastCross=0;const crossMemo=new Map();
function tankNote(x,y){const cols=8,i=Math.min(cols-1,Math.floor(x/W*cols));const oct=2+Math.min(3,Math.floor((1-y/H)*4));return {m:degNote(i,oct),oct};}
function newRing(x,y,held){const {m,oct}=tankNote(x,y);const big=(5-oct);// oct 2..5
  const r={x,y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,r:6,speed:30+ (oct-2)*45,max:Math.min(W,H)*(0.16+big*0.07),m,life:1,held,voice:null,id:Math.random()};
  rings.push(r);if(rings.length>40)rings.shift();return r;}
function tankDown(p){const r=newRing(p.x,p.y,true);r.voice=A.start(r.m,0.22);p.ring=r;flash(p.x,p.y,r.m,40);}
function tankMove(p){const r=p.ring;if(!r)return;const {m}=tankNote(p.x,p.y);
  wakes.push({x:p.x,y:p.y,m,l:1});if(wakes.length>300)wakes.shift();
  r.x=p.x;r.y=p.y;if(m!==r.m){r.m=m;A.glide(r.voice,m,0.06);}}
function tankUp(p){const r=p.ring;if(!r)return;r.held=false;A.release(r.voice,0.5);r.voice=null;r.vx=(Math.random()-.5)*60;r.vy=(Math.random()-.5)*60;}
let waterT=0;
function drawTank(dt){
  waterT+=dt*(RM.matches?.2:1);pulse=Math.max(0,pulse-dt*2.2);const br=0.55+pulse*(RM.matches?.15:.45);
  cx.fillStyle="#04060c";cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation="lighter";
  for(let i=0;i<7;i++){const x=W*(0.5+0.42*Math.sin(waterT*.13*(i+1)+i*1.7)),y=H*(0.5+0.42*Math.cos(waterT*.11*(i+2)+i)),R=Math.max(W,H)*(.35+.05*Math.sin(waterT+i));
    const g=cx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`hsla(${(i*51+root*30+waterT*6)%360},80%,35%,${.16*br})`);g.addColorStop(1,"hsla(0,0%,0%,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);}
  // octave hint lines (very faint)
  for(let i=1;i<4;i++){cx.fillStyle=`rgba(255,255,255,${.025+pulse*.02})`;cx.fillRect(0,H*i/4-1,W,2);}
  for(let i=wakes.length-1;i>=0;i--){const w=wakes[i];w.l-=dt*1.2;if(w.l<=0){wakes.splice(i,1);continue;}cx.fillStyle=col(w.m,60,w.l*.35);cx.beginPath();cx.arc(w.x,w.y,6+18*(1-w.l),0,6.283);cx.fill();}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];
    if(r.held){r.r=Math.min(r.max*1.3,r.r+r.speed*.5*dt);r.life=1;}
    else{r.r+=r.speed*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;
      if(r.x-r.r<0&&r.vx<0||r.x+r.r>W&&r.vx>0)r.vx*=-1;if(r.y-r.r<0&&r.vy<0||r.y+r.r>H&&r.vy>0)r.vy*=-1;
      if(r.r>r.max){r.speed*=-0.5;r.r=r.max;} if(r.r<r.max*.6&&r.speed<0)r.speed*=-0.6; // bounce in size
      r.life-=dt*(0.18+(r.speed>0?0:.1));}
    if(r.life<=0){rings.splice(i,1);continue;}
    const lw=6+10*r.life*(1+pulse*.4);
    cx.strokeStyle=col(r.m,60,.25*r.life);cx.lineWidth=lw*3;cx.beginPath();cx.arc(r.x,r.y,Math.max(1,r.r),0,6.283);cx.stroke();
    cx.strokeStyle=col(r.m,72,.9*r.life);cx.lineWidth=lw;cx.stroke();}
  // crossings
  const now=performance.now();
  for(let i=0;i<rings.length;i++)for(let j=i+1;j<rings.length;j++){const a=rings[i],b=rings[j];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(Math.abs(d-(a.r+b.r))<6&&d>4){const key=a.id+b.id;if(crossMemo.has(key)&&now-crossMemo.get(key)<1500)continue;crossMemo.set(key,now);
      if(now-lastCross<140)continue;lastCross=now;const k=d/(a.r+b.r)||.5,x=a.x+(b.x-a.x)*a.r/(a.r+b.r),y=a.y+(b.y-a.y)*a.r/(a.r+b.r);
      const m=snap(Math.max(a.m,b.m)+7);A.note(m,0.25,0.09);flash(x,y,m,50);spark(x,y,m,8);void k;}}
  if(crossMemo.size>500)crossMemo.clear();
  cx.globalCompositeOperation="source-over";
}

/* ================= 2. BOUNCE ================= */
const bars=[],balls=[];const BAR_W=11;
const DRUMS=["kick","tom","snare","clap","hat"];
function barNote(x1,y1,x2,y2){const len=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2;const i=Math.min(7,Math.floor(mx/W*8));const oct=Math.max(2,Math.min(5,5-Math.floor(len/(Math.max(W,H)*.18))));return degNote(i,oct);}
function ballAt(x,y){for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(Math.hypot(b.x-x,b.y-y)<b.r+20)return b;}return null;}
function bounceDown(p){const b=ballAt(p.x,p.y);if(b){p.grab=b;b.held=true;b.vx=b.vy=0;}}
function bounceMove(p){if(p.grab){p.grab.x=p.x;p.grab.y=p.y;}}
function bounceUp(p,abort){
  if(p.grab){const b=p.grab;b.held=false;const pts=p.path,n=pts.length,a=pts[Math.max(0,n-5)],z=pts[n-1],dt=Math.max(16,z.t-a.t)/1000;
    b.vx=Math.max(-2500,Math.min(2500,(z.x-a.x)/dt));b.vy=Math.max(-2500,Math.min(2500,(z.y-a.y)/dt));return;}
  if(abort||p.cancel)return;
  const len=Math.hypot(p.x-p.x0,p.y-p.y0);
  if(len>40){const m=barNote(p.x0,p.y0,p.x,p.y);bars.push({x1:p.x0,y1:p.y0,x2:p.x,y2:p.y,m,glow:1});if(bars.length>30)bars.shift();A.note(m,0.15,0.15);}
  else if(p.moved<20){const r=bigBall?34:16;balls.push({x:p.x,y:p.y,vx:0,vy:0,r,big:bigBall,m:root+72,hits:new Map(),born:performance.now()});if(balls.length>14)balls.shift();flash(p.x,p.y,root+72,30);}
}
function playHit(bar,ball,x,y){const ac=A.ctx;let when=ac?ac.currentTime:0;
  if(quant&&ac){const s=beatSec()/4,t=ac.currentTime-nextBeatBase;when=nextBeatBase+Math.ceil(t/s)*s;}
  const v=Math.min(1,Math.hypot(ball.vx,ball.vy)/900)*.8+.2;
  if(ball.big){const d=DRUMS[SCALE.indexOf(pcOf(bar.m-root))]||"kick";A.drum(d,when,v);}else A.note(bar.m,0.22,0.22*v,when);
  bar.glow=1;ball.m=bar.m;flash(x,y,bar.m,ball.big?80:50);spark(x,y,bar.m,ball.big?18:10);}
let nextBeatBase=0;
function stepBounce(dt){
  const g=1400,gx=tiltX*g,gy=g*(1+tiltY),now=performance.now();
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.held)continue;
    b.vx+=gx*dt;b.vy+=gy*dt;b.vx*=.999;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8;}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.8;}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.8;}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.72;if(Math.abs(b.vy)<40)b.vy=0;}
    for(const s of bars){const dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy||1;let t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2;t=Math.max(0,Math.min(1,t));
      const px=s.x1+dx*t,py=s.y1+dy*t,ex=b.x-px,ey=b.y-py,d=Math.hypot(ex,ey),min=b.r+BAR_W/2;
      if(d<min&&d>0){const nx=ex/d,ny=ey/d,vn=b.vx*nx+b.vy*ny;b.x=px+nx*min;b.y=py+ny*min;
        if(vn<0){b.vx-=1.9*vn*nx;b.vy-=1.9*vn*ny;const last=b.hits.get(s)||0;if(now-last>90&&Math.abs(vn)>60)playHit(s,b,px,py);b.hits.set(s,now);}}}
    if(now-b.born>60000&&Math.hypot(b.vx,b.vy)<5)balls.splice(i,1);}
}
function drawBounce(dt){
  tiltSmooth(dt);for(let k=0;k<3;k++)stepBounce(Math.min(dt,0.05)/3);
  cx.fillStyle="#06070f";cx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){cx.fillStyle=col(degNote(i,4),45,.06);cx.fillRect(W*i/8,0,W/8,H);}
  cx.lineCap="round";cx.globalCompositeOperation="lighter";
  for(const s of bars){s.glow=Math.max(0,s.glow-dt*2);cx.strokeStyle=col(s.m,55,.35+s.glow*.4);cx.lineWidth=BAR_W*2+s.glow*10;cx.beginPath();cx.moveTo(s.x1,s.y1);cx.lineTo(s.x2,s.y2);cx.stroke();
    cx.strokeStyle=col(s.m,65+s.glow*20,1);cx.lineWidth=BAR_W;cx.stroke();}
  for(const p of ptrs.values())if(!p.grab&&!p.cancel&&Math.hypot(p.x-p.x0,p.y-p.y0)>20){const m=barNote(p.x0,p.y0,p.x,p.y);cx.strokeStyle=col(m,60,.6);cx.lineWidth=BAR_W;cx.beginPath();cx.moveTo(p.x0,p.y0);cx.lineTo(p.x,p.y);cx.stroke();}
  for(const b of balls){const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.4);g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(.35,col(b.m,70,.9));g.addColorStop(1,col(b.m,50,0));cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r*2.4,0,6.283);cx.fill();}
  cx.globalCompositeOperation="source-over";
}

/* ================= 3. PAINT LOOP ================= */
const STEPS=64,ROWS=10,LANES=["kick","snare","hat"];const strokes=[];let playStep=-1,loopStart=0,schedStep=0;
function geo(){const top=Math.max(84,H*.1),drumH=Math.max(90,H*.2),bot=H-drumH;return {top,bot,rowH:(bot-top)/ROWS,laneH:drumH/3,left:0,stepW:W/STEPS};}
function rowNote(r){return degNote(ROWS-1-r,3);} // top=high
function paintDown(p){p.stroke={pts:[{x:p.x,y:p.y}],live:true};strokes.push(p.stroke);}
function paintMove(p){if(p.stroke)p.stroke.pts.push({x:p.x,y:p.y});}
function paintUp(p,abort){const s=p.stroke;if(!s)return;if(abort||p.cancel){strokes.splice(strokes.indexOf(s),1);return;}s.live=false;
  const G=geo(),xs=s.pts.map(q=>q.x),ys=s.pts.map(q=>q.y),y=ys.reduce((a,b)=>a+b,0)/ys.length;
  const s0=Math.max(0,Math.min(STEPS-1,Math.floor(Math.min(...xs)/G.stepW))),s1=Math.max(s0,Math.min(STEPS-1,Math.floor(Math.max(...xs)/G.stepW)));
  if(y>=G.bot){s.lane=Math.min(2,Math.floor((y-G.bot)/G.laneH));s.drum=LANES[s.lane];s.steps=[];
    if(s1-s0<2)s.steps.push(s0);else for(let k=s0;k<=s1;k+=2)s.steps.push(k);s.m=[0,4,7][s.lane]+root+48;A.drum(s.drum,0,.7);}
  else{const r=Math.max(0,Math.min(ROWS-1,Math.floor((y-G.top)/G.rowH)));s.m=rowNote(r);s.s0=s0;s.s1=s1-s0<2?s0:s1;s.held=s1-s0>=2;A.note(s.m,.2,.2);}
  s.glow=1;if(strokes.length>120)strokes.shift();}
function paintSched(){const ac=A.ctx;if(!ac)return;const sd=beatSec()/4;
  if(!loopStart||ac.currentTime-loopStart>sd*STEPS*4){loopStart=ac.currentTime+0.05;schedStep=0;}
  if(loopStart+schedStep*sd<ac.currentTime-0.2)schedStep=Math.ceil((ac.currentTime-loopStart)/sd);
  while(loopStart+schedStep*sd<ac.currentTime+0.12){const st=schedStep%STEPS,t=loopStart+schedStep*sd;
    if(mode==="paint")for(const s of strokes){if(s.live)continue;
      if(s.drum){if(s.steps.includes(st))A.drum(s.drum,t,.75);}
      else if(s.s0===st)A.note(s.m,s.held?(s.s1-s.s0+1)*sd:sd*.9,.2,t);}
    schedStep++;}
  playStep=((ac.currentTime-loopStart)/sd)%STEPS;if(playStep<0)playStep+=STEPS;}
function drawPaint(dt){
  const G=geo();cx.fillStyle="#05060c";cx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){const m=rowNote(r);cx.fillStyle=col(m,40,.22);cx.fillRect(0,G.top+r*G.rowH+1,W,G.rowH-2);}
  for(let b=0;b<=4;b++){cx.fillStyle="rgba(255,255,255,.12)";cx.fillRect(W*b/4-1,G.top,2,H-G.top);}
  for(let l=0;l<3;l++){cx.fillStyle=["rgba(255,224,102,.16)","rgba(255,138,122,.16)","rgba(158,231,245,.16)"][l];cx.fillRect(0,G.bot+l*G.laneH+2,W,G.laneH-4);}
  const px=playStep>=0?playStep*G.stepW:-99,cur=Math.floor(playStep);
  cx.globalCompositeOperation="lighter";cx.lineCap="round";cx.lineJoin="round";
  for(const s of strokes){let on=false;
    if(!s.live){if(s.drum)on=s.steps.includes(cur);else on=cur>=s.s0&&cur<=s.s1;}
    if(on)s.glow=1;else s.glow=Math.max(0,(s.glow||0)-dt*2.5);
    const c=s.drum?["#ffe066","#ff8a7a","#9ee7f5"][s.lane]:null,m=s.m!=null?s.m:snap(root+60);
    cx.strokeStyle=c||col(m,60,.35+s.glow*.4);cx.lineWidth=(s.pts.length<4?22:13)+s.glow*8;cx.globalAlpha=c?.4+s.glow*.4:1;
    cx.beginPath();s.pts.forEach((q,i)=>i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y));if(s.pts.length===1)cx.lineTo(s.pts[0].x+.1,s.pts[0].y);cx.stroke();
    cx.globalAlpha=1;cx.strokeStyle=c||col(m,75+s.glow*15,1);cx.lineWidth=s.pts.length<4?11:6;cx.stroke();
    if(on&&!RM.matches&&Math.random()<.3){const q=s.pts[0];spark(Math.max(q.x,px),q.y,m,1);}}
  const g=cx.createLinearGradient(px-40,0,px+40,0);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.5,"rgba(255,255,240,.55)");g.addColorStop(1,"rgba(255,255,255,0)");
  cx.fillStyle=g;cx.fillRect(px-40,G.top,80,H-G.top);
  cx.globalCompositeOperation="source-over";
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  checkLong(now);beatTick();if(A.ctx)nextBeatBase=nextBeat-beatSec();paintSched();
  if(mode==="tank")drawTank(dt);else if(mode==="bounce")drawBounce(dt);else drawPaint(dt);
  drawFx(dt);
  if(keyFlash>0){keyFlash=Math.max(0,keyFlash-dt*1.5);cx.fillStyle=col(root+60,55,keyFlash*.35);cx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
addEventListener("storage",()=>{BPM=A.bpm();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__room={setMode,get counts(){return {rings:rings.length,bars:bars.length,balls:balls.length,strokes:strokes.length};}};
</script>
</body>
