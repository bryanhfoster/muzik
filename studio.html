let pull=null, pullFrame=0;
const PULL_HOLD=2200;
function stopPull(){
  pull=null;
  if(pullFrame) cancelAnimationFrame(pullFrame);
  pullFrame=0;
  const hint=$("pullHint");
  if(hint){ hint.classList.remove("on"); hint.style.setProperty("--p","0%"); }
}
function beginPull(x,y){
  pull={x, y, armed:0};
}
function movePull(x,y,ev){
  if(!pull) return;
  const dy=y-pull.y, dx=Math.abs(x-pull.x);
  const hint=$("pullHint");
  if(dy<18 || dy<dx){
    if(pull.armed){

function slideTo(m,e){

    if(Math.abs(to-from)>0.01) finger.o.frequency.exponentialRampToValueAtTime(to, nowT+t);

function pendingClips(){
  const evs=seq.events||[], ons=evs.filter(e=>e.type==="on");
  if(!ons.length) return [];
  const t0=ons[0].dt, now=seq.t0?performance.now()-seq.t0:0;
  return ons.map((on,i)=>{
    const off=on.pv?evs.find(e=>e.type==="off"&&e.pv&&e.id===on.id):evs.find(e=>e.type==="off"&&!e.pv&&e.dt>on.dt);
    const next=ons[i+1];
    const endDt=off?off.dt:(next?next.dt:Math.max(on.dt+80, now));
    return {name:noteName(on.midi),start:Math.max(0,(on.dt-t0)/1000),dur:Math.max(0.08,(endDt-on.dt)/1000)};
  });
}
function snapT(t){ if(!$("snap").checked) return t; const spb=60/Number($("bpm").value||120); return Math.round(t/(spb/4))*(spb/4); }
function queueCount(){

}
function timeW(){
  const d=$("desk");

}
function fitPPS(){ PPS=timeW()/VIEW; }
function clipGeom(start,dur){
  const x=Math.max(0, start*PPS);
  const w=Math.max(8, Math.min(timeW()-x, Math.max(0.05,dur)*PPS));

}
function laneW(){

function trackSpan(tr){
  let a=Infinity, b=-Infinity;
  (tr.clips||[]).forEach(c=>{
    const s=(c.start||0)+loopOrigin(tr);
    a=Math.min(a,s);
    b=Math.max(b, s+Math.max(0.05, c.dur||0));

function geomFor(tr, start, dur){

    const pps=laneW()/Math.max(0.05, span.b-span.a);

function paintKeep(){
  const bits=pendingClips();
  const meta=document.querySelector(".pend .meta");
  if(meta){
    if(capturing) meta.textContent=bits.length?("REC · "+bits.length):"REC";
    else if(takeBuf) meta.textContent=bits.length?("MIC · "+bits.length):"MIC";
    else meta.textContent=queueCount()?("Queue · "+queueCount()):"Queue";
  }
  const cv=document.querySelector("canvas.pend-roll");
  if(!cv) return;
  const ctx=cv.getContext("2d");
  const dd=Number(cv.dataset.dpr)||1; ctx.setTransform(dd,0,0,dd,0,0);
  const w=cv.width/dd, h=cv.height/dd;
  ctx.fillStyle="#1b1812"; ctx.fillRect(0,0,w,h);
  lanePaintGrid(ctx,w,h);
  const samples=takeSamples();
  if(samples){
    ctx.strokeStyle=capturing?"#ff5a45":"#7dffa1";
    ctx.lineWidth=1.5; ctx.beginPath();
    const n=samples.length;
    for(let x=0;x<w;x++){
      const s=samples[Math.min(n-1, Math.floor(x/w*n))]||0;
      const y=h/2 - Math.max(-1,Math.min(1,s))*(h*0.42);
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  if(!bits.length){ paintDrumMarks(ctx,h); return; }
  const midis=bits.map((b,i)=>{
    const on=(seq.events||[]).filter(e=>e.type==="on")[i];
    return on?on.midi:60;
  });
  const lo=Math.min(...midis)-2, hi=Math.max(...midis)+2, span=Math.max(1,hi-lo);
  bits.forEach((c,i)=>{
    const midi=midis[i];
    const bh=12;
    const y=((hi-midi)/span)*(h-bh-6)+3;
    const x=c.start*PPS, ww=Math.max(10,c.dur*PPS);
    let col="#ffe066";
    try{ if(typeof pitchColor==="function") col=pitchColor(midi); }catch(_){}

  });

function drumColor(name){
  return {snare:"#ff8a7a",clap:"#ff8ac0",rim:"#e6d2b8",tom:"#e09050",hat:"#9ee7f5",open:"#b6f0c8",crash:"#d4ccff",cow:"#ffb45a",shake:"#f3e7a0"}[name]||"#ffe066";
}
function paintDrumMarks(ctx,h){
  const evs=seq.events||[];
  const first=evs.find(e=>e.type==="on"||e.type==="drum");
  if(!first) return;
  evs.forEach(e=>{
    if(e.type!=="drum") return;
    const x=((e.dt-first.dt)/1000)*PPS;
    const w=Math.max(14, drumDur(e.drum)*PPS);
    ctx.fillStyle=drumColor(e.drum);
    laneRound(ctx, x, 8, w, h-16, 4);
    ctx.fillStyle="#111";
    ctx.font="800 10px monospace";

function takeSamples(){
  if(voiceCap&&voiceCap.chunks&&voiceCap.chunks.length){
    let total=0;
    for(let i=0;i<voiceCap.chunks.length;i++) total+=voiceCap.chunks[i].length;
    if(total<2) return null;
    const out=new Float32Array(240);
    let ci=0, seen=0;
    for(let x=0;x<out.length;x++){
      const target=Math.floor(x/out.length*(total-1));
      while(ci<voiceCap.chunks.length && seen+voiceCap.chunks[ci].length<=target){ seen+=voiceCap.chunks[ci].length; ci++; }
      const arr=voiceCap.chunks[ci];
      out[x]=arr?arr[Math.min(arr.length-1, Math.max(0,target-seen))]||0:0;
    }
    return out;
  }
  if(takeBuf){
    const data=takeBuf.getChannelData(0);
    const out=new Float32Array(240);
    for(let x=0;x<out.length;x++) out[x]=data[Math.min(data.length-1, Math.floor(x/out.length*data.length))]||0;
    return out;
  }
  return null;
}

addEventListener("pointermove", e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(Math.abs(e.clientX-drag.ox)<4 && !drag.moved) return;
  drag.moved=true;
  if(e.cancelable) e.preventDefault();
  const dt=(e.clientX-drag.ox)/(drag.pps||PPS);
  const c=drag.clip;
  if(drag.mode==="move") c.start=Math.max(0, snapT(drag.ostart+dt));
  if(drag.mode==="right") c.dur=Math.max(0.05, snapT(Math.max(0.05, drag.odur+dt)));
  if(drag.mode==="left"){
    const end=drag.ostart+drag.odur;
    const ns=Math.max(0, snapT(drag.ostart+dt));
    c.start=Math.min(ns, end-0.05);
    c.dur=Math.max(0.05, end-c.start);
  }
  const x=((c.start+loopOrigin(drag.track))-(drag.origin||0))*(drag.pps||PPS);
  const w=Math.max(12, c.dur*(drag.pps||PPS));
  drag.el.style.left=x+"px";
  drag.el.style.width=w+"px";
}, {passive:false});

function drawRuler(cv){

function beatSec(){ const v=Number($("bpm")&&$("bpm").value)||120; return 60/Math.max(40,Math.min(220,v)); }
function lanePaintGrid(ctx,w,h){

function laneRound(ctx,x,y,w,h,r){

function waveY(type, ph){
  const h=HARM[type];
  if(h){
    let y=0, n=0;
    for(let i=1;i<h.length;i++){ if(!h[i]) continue; y+=h[i]*Math.sin(ph*Math.PI*2*i); n+=h[i]; }
    return n?y/n:0;
  }
  const s=Math.sin(ph*Math.PI*2);
  if(type==="square") return ph<0.5?1:-1;
  if(type==="sawtooth") return 1-2*ph;
  if(type==="triangle") return ph<0.5?4*ph-1:3-4*ph;
  return s;
}
function easeEnv(t, dur){
  const fade=Math.min(0.06, dur*0.25);
  if(t<fade) return 0.5-0.5*Math.cos(Math.PI*t/fade);
  if(t>dur-fade) return 0.5-0.5*Math.cos(Math.PI*(dur-t)/fade);
  return 1;
}
function drawClipWave(cv, clip){

let pianoModeVal=(()=>{ try{ return localStorage.getItem("piano-mode")==="voice"?"voice":"piano"; }catch(_){ return "piano"; } })();
const PV_MAX=16, pianoLive=new Map(); let pvVoices=[], pvId=0, hammerBuf=null;
function pianoNote(m, when, dest, velo){
  const t=Math.max(when, ac.currentTime), f=Math.max(20,hz(m)), rel=261.63/f;
  const amp=0.22*(velo||1)*Math.min(1.5,Math.max(0.6,Math.pow(rel,0.18)));
  const tau=Math.max(0.25, Math.min(2.2, 1.1*Math.pow(rel,0.5)));   // decay time constant: low notes ring longer
  const out=ac.createGain(), lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=0.7;
  out.gain.setValueAtTime(0.0001,t); out.gain.linearRampToValueAtTime(amp,t+0.005);
  out.gain.setTargetAtTime(amp*0.6,t+0.005,0.06);             // fast initial drop after strike
  out.gain.setTargetAtTime(0.00001,t+0.12,tau);                // natural exponential decay while held
  const b0=Math.min(16000,f*10+2200), b1=Math.min(8000,f*2.2+250);
  lp.frequency.setValueAtTime(b0,t); lp.frequency.setTargetAtTime(b1,t+0.01,tau*0.45);  // brightness closes
  lp.connect(out); out.connect(dest);
  const oscs=[], B=0.00035, amps=[1,0.55,0.32,0.22,0.13,0.08];
  amps.forEach((a,i)=>{
    const n=i+1, pf=f*n*Math.sqrt(1+B*n*n); if(pf>ac.sampleRate*0.45) return;
    const o=ac.createOscillator(); o.type="sine"; o.frequency.value=pf; if(n===1) o.detune.value=1.5;
    const g=ac.createGain(); g.gain.setValueAtTime(a,t); g.gain.setTargetAtTime(a*0.25,t+0.01,tau/(0.6+n*0.5));
    o.connect(g); g.connect(lp); o.start(t); oscs.push(o);
  });
  if(!hammerBuf){ hammerBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.05),ac.sampleRate); const d=hammerBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.18)); }
  const hs=ac.createBufferSource(); hs.buffer=hammerBuf; const hb=ac.createBiquadFilter(); hb.type="bandpass"; hb.frequency.value=Math.min(9000,f*3+800); hb.Q.value=1.2;
  const hg=ac.createGain(); hg.gain.value=amp*0.9; hs.connect(hb); hb.connect(hg); hg.connect(out); hs.start(t); oscs.push(hs);
  let endAt=t+tau*9+0.3; oscs.forEach(o=>{ try{ o.stop(endAt); }catch(_){} });
  const v={midi:m, t, out, released:false,
    release(at, fast){
      if(v.released) return; v.released=true;
      const r=Math.max(at==null?ac.currentTime:at, ac.currentTime), d=fast?0.012:0.05;   // ~0.2s damper (tau 0.05 -> -40dB in ~0.23s)
      try{ if(out.gain.cancelAndHoldAtTime) out.gain.cancelAndHoldAtTime(r); else { out.gain.cancelScheduledValues(r); out.gain.setValueAtTime(Math.max(0.00001,out.gain.value),r); } }catch(_){}
      out.gain.setTargetAtTime(0,r,d);
      endAt=Math.min(endAt,r+d*8); oscs.forEach(o=>{ try{ o.stop(endAt); }catch(_){} });
      setTimeout(()=>{ try{ out.disconnect(); }catch(_){} }, Math.max(0,(endAt-ac.currentTime)*1000+200));
    }};
  v.player={g:out, o:{stop(){ oscs.forEach(o=>{ try{ o.stop(); }catch(_){} }); }, disconnect(){}}};
  return v;
}
function pianoMarkHeld(){ const on=new Set([...pianoLive.values()].map(x=>x.v.midi)); document.querySelectorAll("#piano .pk").forEach(k=>k.classList.toggle("down",on.has(Number(k.dataset.m)))); }
function pianoTick(){ if(pianoLive.size){ refreshPending(); requestAnimationFrame(pianoTick); } }
function pianoDown(m, key){
  audio(); if(ac.state==="suspended") ac.resume();
  if(pianoLive.has(key)) pianoUp(key);
  pvVoices=pvVoices.filter(v=>!v.released||v.t>ac.currentTime-3);
  const active=pvVoices.filter(v=>!v.released);
  if(active.length>=PV_MAX){ const old=active[0]; old.release(null,true); for(const [k,x] of pianoLive) if(x.v===old){ pianoLive.delete(k); seqPush("off",old.midi,{pv:1,id:x.id}); } }

  const v=pianoNote(m, ac.currentTime, filter, 1); pvVoices.push(v);

}
function pianoUp(key){
  const x=pianoLive.get(key); if(!x) return; pianoLive.delete(key);

function schedulePianoClip(c, tr, t0){

function paintPianoMode(){ const b=$("pianoMode"); if(!b) return; b.textContent=pianoModeVal==="piano"?"Piano":"Voice"; b.classList.toggle("voice",pianoModeVal!=="piano"); b.setAttribute("aria-pressed",String(pianoModeVal==="piano")); }
// ---- piano keyboard ----
let pianoBase=innerWidth<560?60:48; const pianoPtrs=new Map();
const PIANO_KEYS="awsedftgyhujkolp;'";
function pianoSpan(){ return innerWidth<560?12:24; }
function pianoMark(m){ document.querySelectorAll("#piano .pk").forEach(k=>k.classList.toggle("down",m!=null&&Number(k.dataset.m)===m)); }
function buildPiano(){
  const box=$("piano"); if(!box) return; box.innerHTML="";
  const n=pianoSpan(), whites=[]; for(let i=0;i<n;i++){ if(![1,3,6,8,10].includes(i%12)) whites.push(i); }
  const ww=100/whites.length; let wi=0;
  for(let i=0;i<n;i++){
    const m=pianoBase+i, pc=i%12, black=[1,3,6,8,10].includes(pc);
    const b=document.createElement("button"); b.type="button"; b.dataset.m=String(m); b.title=NAMES[pc]+(Math.floor(m/12));
    const col=pitchColor(m);
    if(black){ b.className="pk b"; b.style.left=(wi*ww-ww*0.3)+"%"; b.style.width=(ww*0.6)+"%"; b.style.background=`linear-gradient(#111 0%, #111 55%, color-mix(in srgb, ${col} 55%, #111) 100%)`; }
    else { b.className="pk w"; b.style.left=(wi*ww)+"%"; b.style.width=ww+"%"; b.style.background=`linear-gradient(#fbf8f2 0%, #fbf8f2 60%, color-mix(in srgb, ${col} 40%, #fff) 100%)`; wi++;
      if(pc===0) b.innerHTML="<span>C"+(Math.floor(m/12))+"</span>"; }

  }

  $("octHi").textContent="B"+(Math.floor((pianoBase+n-1)/12));

}
function pianoFollow(m){
  if(!$("piano")) return;
  const n=pianoSpan(); let base=Math.floor(m/12)*12;
  while(base+n-1>119 && base>12) base-=12;   // clamp: shift down if range doesn't fit
  base=Math.max(12,Math.min(96,base));
  if(base===pianoBase) return;
  const dir=base>pianoBase?1:-1; pianoBase=base; buildPiano(); pianoAnim(dir);
}
function pianoAnim(dir){
  const box=$("piano"); if(box&&box.animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches)
    box.animate([{transform:`translateX(${dir*40}%)`,opacity:.3},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.3,1)"});
  ["octLo","octHi"].forEach(id=>{ const e=$(id); if(e){ e.classList.remove("octFlash"); void e.offsetWidth; e.classList.add("octFlash"); } });
}
function pianoKeyAt(x,y){ const el=document.elementFromPoint(x,y); const k=el&&el.closest&&el.closest("#piano .pk"); return k?Number(k.dataset.m):null; }
function pianoPress(m,e){ setKeyRoot(m); if(finger&&finger.o&&!finger.dead){ try{ slideTo(m,e); return; }catch(err){} } fingerDown(e,m,true); }
function wirePiano(){
  const box=$("piano"); if(!box) return;
  box.addEventListener("pointerdown",e=>{
    const m=pianoKeyAt(e.clientX,e.clientY); if(m==null) return;
    e.preventDefault(); try{ box.setPointerCapture(e.pointerId); }catch(err){}
    pianoPtrs.set(e.pointerId,m);
    if(pianoModeVal==="piano"){ setKeyRoot(m); pianoDown(m,"p"+e.pointerId); } else pianoPress(m,e);
  });
  box.addEventListener("pointermove",e=>{
    if(!pianoPtrs.has(e.pointerId)) return;
    const m=pianoKeyAt(e.clientX,e.clientY); if(m==null||m===pianoPtrs.get(e.pointerId)) return;
    pianoPtrs.set(e.pointerId,m);
    if(pianoModeVal==="piano"){ pianoUp("p"+e.pointerId); pianoDown(m,"p"+e.pointerId); return; }
    if(finger) try{ slideTo(m,e); }catch(err){}
  });
  const up=e=>{
    if(!pianoPtrs.has(e.pointerId)) return; pianoPtrs.delete(e.pointerId);
    if(pianoLive.has("p"+e.pointerId)){ pianoUp("p"+e.pointerId); return; }
    if(pianoPtrs.size){ const m=[...pianoPtrs.values()].pop(); if(finger) try{ slideTo(m,e); }catch(err){} }

  };

  addEventListener("resize",()=>{ const n=$("piano").children.length; if(n!==pianoSpan()) buildPiano(); });

    if(e.target.matches("input,textarea,select")||e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
    if(lastInput==="drum"||lastInput==="noise") return;
    const k=e.key.toLowerCase();
    if(k==="z"||k==="x"){ e.preventDefault(); e.stopImmediatePropagation(); shift(k==="z"?-1:1); return; }

  },true);

  const mb=$("pianoMode"); if(mb){ paintPianoMode(); mb.onclick=()=>{ pianoModeVal=pianoModeVal==="piano"?"voice":"piano"; try{ localStorage.setItem("piano-mode",pianoModeVal); }catch(_){} [...pianoLive.keys()].forEach(pianoUp); paintPianoMode(); }; }
}

/* ---- timeline resize / collapse ---- */
(function(){
  const body=document.body, handle=$("tlHandle"), btn=$("tlToggle"), desk=$("desk");
  if(!handle||!desk) return;
  const KEY_H="muzik.tlHeight", KEY_C="muzik.tlCollapsed", MIN=72, COLL=24, KEYS_MIN=150, EMPTY_H=84;
  let h=Number(localStorage.getItem(KEY_H))||0, collapsed=localStorage.getItem(KEY_C)==="1";
  function maxH(){
    const cs=getComputedStyle(body), pad=parseFloat(cs.paddingTop)||0;
    const hud=document.querySelector(".hud"), hdr=document.querySelector("header");
    return Math.max(MIN, innerHeight-pad-handle.offsetHeight-(hud?hud.offsetHeight:0)-(hdr?hdr.offsetHeight:0)-KEYS_MIN);
  }
  let rT=0;
  function redraw(){ cancelAnimationFrame(rT); rT=requestAnimationFrame(()=>{ try{ render(); }catch(_){} }); }
  function apply(save){
    if(collapsed){ body.style.setProperty("--tlh", COLL+"px"); body.classList.add("tl-collapsed"); desk.scrollTop=0; }
    else { body.classList.remove("tl-collapsed");
      const empty=!desk.querySelector(".card:not(.pending)");
      if(h){ h=Math.round(Math.min(maxH(), Math.max(MIN,h))); body.style.setProperty("--tlh", (empty?Math.min(h,EMPTY_H):h)+"px"); }
      else if(empty) body.style.setProperty("--tlh", EMPTY_H+"px");
      else body.style.removeProperty("--tlh"); }
    btn.textContent=collapsed?"▼ Show":"▲ Hide";
    btn.setAttribute("aria-expanded", String(!collapsed));
    if(save){ try{ if(h) localStorage.setItem(KEY_H,String(h)); localStorage.setItem(KEY_C,collapsed?"1":"0"); }catch(_){} }
    redraw();
  }
  function toggle(){ collapsed=!collapsed; apply(true); }
  btn.addEventListener("click", e=>{ e.stopPropagation(); toggle(); });
  btn.addEventListener("pointerdown", e=>e.stopPropagation());
  handle.addEventListener("dblclick", e=>{ if(e.target===btn) return; toggle(); });
  let drag=null;
  handle.addEventListener("pointerdown", e=>{
    if(e.target===btn) return;
    e.preventDefault();
    drag={y:e.clientY, h0:collapsed?COLL:desk.getBoundingClientRect().height, moved:false, id:e.pointerId};
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    handle.classList.add("dragging");
  });
  handle.addEventListener("pointermove", e=>{
    if(!drag) return;
    const dy=e.clientY-drag.y;
    if(!drag.moved && Math.abs(dy)<4) return;
    drag.moved=true;
    const nh=drag.h0+dy;
    if(nh<MIN-30){ if(!collapsed){ collapsed=true; apply(false); } return; }
    collapsed=false; h=Math.max(MIN, nh); apply(false);
  });
  function end(){ if(!drag) return; const m=drag.moved; drag=null; handle.classList.remove("dragging"); if(m) apply(true); }
  handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
  handle.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); collapsed=false; h=(h||desk.getBoundingClientRect().height)+(e.key==="ArrowDown"?24:-24); apply(true); }
  });
  handle.tabIndex=0;
  addEventListener("resize", ()=>apply(false));
  window.muzikTimeline={ set(px){ h=px; collapsed=false; apply(true); }, collapse(c){ collapsed=!!c; apply(true); } };
  let wasEmpty=!desk.querySelector(".card:not(.pending)");
  new MutationObserver(()=>{ const e=!desk.querySelector(".card:not(.pending)"); if(e!==wasEmpty){ wasEmpty=e; apply(false); } }).observe(desk,{childList:true,subtree:true});
  apply(false);
})();

/* ---- cursor tracer ---- */
(function(){
  const cv=$("tracer"); if(!cv) return;
  const mq=matchMedia("(prefers-reduced-motion: reduce)");
  const ctx=cv.getContext("2d"), N=8, pts=[];
  let raf=0, last=0, W=0, H=0;
  function size(){ const d=devicePixelRatio||1; W=innerWidth; H=innerHeight; cv.width=Math.round(W*d); cv.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0); }
  size(); addEventListener("resize", size);
  function frame(now){
    raf=0;
    ctx.clearRect(0,0,W,H);
    const idle=now-last, fade=Math.max(0, 1-idle/450);
    if(fade<=0||!pts.length){ pts.length=0; return; }
    for(let i=0;i<pts.length;i++){
      const p=pts[i], k=(i+1)/pts.length, a=0.38*k*fade, r=3+6*k;
      ctx.fillStyle="rgba(255,224,102,"+a.toFixed(3)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832); ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  addEventListener("pointermove", e=>{
    if(mq.matches||e.pointerType==="touch") return;
    pts.push({x:e.clientX,y:e.clientY}); if(pts.length>N) pts.shift();
    last=performance.now();
    if(!raf) raf=requestAnimationFrame(frame);
  }, {passive:true});
  mq.addEventListener&&mq.addEventListener("change", ()=>{ pts.length=0; ctx.clearRect(0,0,W,H); });
})();
